name: Validate repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install "pandas>=2.1"
      - name: Compile Python sources
        run: python -m py_compile code/*.py tools/*.py examples/baseline_p200/verify_results.py
      - name: Validate processed inputs
        run: python tools/validate_inputs.py data/processed
      - name: Verify baseline case study
        run: python examples/baseline_p200/verify_results.py
      - name: Verify checksums
        run: |
          sha256sum -c SHA256SUMS.txt
          cd examples/baseline_p200
          sha256sum -c SHA256SUMS.txt

